name: 更新 ETF 資料

on:
  # 台北時間每天 09:05、14:05、19:05（GitHub 用 UTC，所以要減 8 小時）
  schedule:
    - cron: '5 1 * * *'
    - cron: '5 6 * * *'
    - cron: '5 11 * * *'
  # 讓你可以在 Actions 分頁手動按「Run workflow」立刻抓一次
  workflow_dispatch:
  # 每次改動程式碼推上來時也抓一次
  push:
    paths:
      - 'scripts/fetch.mjs'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: update-etf-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 取得倉庫內容
        uses: actions/checkout@v4

      - name: 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 去證交所抓資料
        run: node scripts/fetch.mjs

      - name: 有變動才存回倉庫
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "資料沒有變化，不需要提交"
          else
            git commit -m "自動更新 ETF 資料（$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') 台北）"
            git push
          fi
